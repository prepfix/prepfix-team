<style>

input,select{background:#0f1115;border:1px solid #363c48;border-radius:10px;padding:10px 12px;width:100%}
header{position:sticky;top:0;z-index:20;background:#16181dee;backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid #262b34}
.hd{display:flex;align-items:center;gap:10px}.hd img{height:30px;border-radius:6px}

.login input{text-align:center;font-size:20px;letter-spacing:.15em;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--cb) + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2e9d6b;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-weight:600;max-width:90vw;text-align:center}
.toast.err{background:#b8392f}
#prac{position:fixed;left:0;right:0;bottom:calc(var(--cb) + env(safe-area-inset-bottom));z-index:50;background:#12151b;border-top:1px solid #3a4150;box-shadow:0 -8px 24px #0008}
#prac .phd{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 12px;background:#1c2028}

#prac .pbody{background:#000;height:min(56vw,300px)}#prac.small .pbody{height:110px}
#prac.demo .pbody{height:auto}#prac iframe,#prac video{display:block;width:100%;height:100%;border:0}#prac audio{width:100%;display:block}

@media(min-width:800px){#prac{left:auto;right:14px;bottom:calc(var(--cb) + env(safe-area-inset-bottom) + 14px);width:440px;border:1px solid #3a4150;border-radius:12px;overflow:hidden}#prac .pbody{height:248px}}
body.pracOn main{padding-bottom:calc(120px + var(--cb))}
@media(max-width:799px){
  #prac{top:var(--hh,0px);bottom:auto;border-top:0;border-bottom:1px solid #3a4150;box-shadow:0 8px 24px #0008;z-index:19}
  body.pracOn main{padding-top:calc(var(--ph,0px) + 12px)}
}

.pst.on{color:#e0b24a;background:#2a2410}.pst.ok{color:#7fd6a8;background:#14261d}

.nav2 button{flex:1}
dialog{background:#1d2026;color:#ece8e1;border:1px solid #363c48;border-radius:14px;width:min(92vw,420px)}dialog::backdrop{background:#000a}
dialog label{display:block;font-size:13px;color:#8a90a0;margin:10px 0 4px}
#credit{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--cb) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;background:#12151b;border-top:1px solid #262b34;font-size:11px;font-weight:700;letter-spacing:.08em;color:#e0b24a;white-space:nowrap}

/* splash + install popup */

#splash img,.inst img{width:260px;max-width:72vw;border-radius:14px;background:#fff;padding:10px}
#splash .st{margin-top:16px;font-weight:800;letter-spacing:.12em;color:#ece8e1}

/* search many songs */
#mdlg{width:min(94vw,560px);max-height:92vh}

.mt.sub{background:none;border-left-color:#363c48;color:#8a90a0;font-weight:600;font-size:12.5px}
.mt.bad{background:#3a1d1b;border-left-color:#b8392f;color:#ff8a7e;font-weight:600}
.mr{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid #22262e;cursor:pointer;margin:0;font-size:15px;color:#ece8e1}
.mr input[type=checkbox]{width:22px;height:22px;padding:0;flex:0 0 auto;margin:1px 0 0;accent-color:#e0b24a}
.mr small{display:block;color:#8a90a0;font-size:12.5px}
.mr.dup{opacity:.55;cursor:default}.mr .mk{width:22px;flex:0 0 auto;text-align:center;color:#8a90a0}

/* launcher glow */
@keyframes glowBox{0%,100%{box-shadow:0 0 14px #e0b24a66,0 0 32px #e0b24a33}50%{box-shadow:0 0 30px #e0b24acc,0 0 64px #e0b24a77}}
@keyframes glowTxt{0%,100%{text-shadow:0 0 6px #e0b24a88,0 0 14px #e0b24a44}50%{text-shadow:0 0 12px #e0b24a,0 0 28px #e0b24acc,0 0 46px #e0b24a77}}
#splash img{animation:glowBox 2.2s ease-in-out infinite}
#splash .ch{margin-top:8px;font-weight:800;font-size:17px;letter-spacing:.1em;color:#e0b24a;animation:glowTxt 2.2s ease-in-out infinite}
#splash .by{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));margin:0;padding:0 12px;animation:glowTxt 2.2s ease-in-out infinite}
</style></head><body>
<div id="splash" onclick="hideSplash();autoFull()"><img src="logo.jpg" alt="Prepfix"><div class="st">PREPFIX TEAM</div><div class="ch" id="spCh"></div><div class="by">DEVELOPED BY CYRUS IRERI 0720872582<small>irericyrus004@gmail.com</small></div></div>
<div id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="mdlg"></dialog>
<div id="credit">DEVELOPED BY CYRUS IRERI&nbsp;<a href="tel:0720872582">0720872582</a></div>
<script>
/* PREPFIX TEAM - the praise and worship team's app.
   Shows the church's songs (lyrics + practice link) from the Prepfix Church Media Toolkit,
   lets a leader build a playlist with sections and send it to the church toolkit. */
const API=window.PREPFIX_API||'https://script.google.com/macros/s/AKfycbyU3Qfwfsu_sF0gC5GGuclMPkMfcFBmTKdw41-2GZRS2zGWbHHU1AJdZ48JyEHNa74e/exec';
const DEMO=window.PREPFIX_DEMO||null;
const SEC_NAMES=['Slow set','Fast set','Praise','Worship','Presentation','Choir','Echoes','Special song','Offering','Altar call'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('pft_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('pft_'+k,JSON.stringify(v))}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,9);
// the link carries the church's name and its code, e.g. ?church=fgck-muranga-lca-786053373dbf
const QP=new URLSearchParams(location.search),RAW=(QP.get('church')||QP.get('c')||'').trim();
const LINK_NAME=RAW.includes('-')?RAW.split('-').slice(0,-1).join(' ').toUpperCase():'';
let code=((RAW.split('-').pop())||window.PREPFIX_CODE||store.get('code','')).toLowerCase().replace(/[^0-9a-f]/g,'');
if(LINK_NAME&&!store.get('cname_'+code,''))store.set('cname_'+code,LINK_NAME);
if(DEMO&&!code)code='dee0';
let pin=store.get('pin',''),D=store.get('data_'+code,null);
// the church's own name (exactly as in its toolkit once the songs have loaded; from the link before that)
const churchName=()=>(D&&D.church)||store.get('cname_'+code,'')||LINK_NAME;
{const e=document.getElementById('spCh');if(e)e.textContent=churchName()}
// a MEMBER signs in once with their phone number + PIN; then this phone is theirs (remembered always)
let ph=store.get('ph_'+code,''),loginMsg='';
const did=store.get('did','')||(()=>{const d=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');store.set('did',d);return d})();
const plat=/android/i.test(navigator.userAgent)?'and':/iphone|ipad|ipod/i.test(navigator.userAgent)?'ios':'pc';
function normPhone(s){const raw=String(s||'').trim();let d=raw.replace(/\D/g,'');
  if(raw.startsWith('+')&&d.length>=9)return d.startsWith('2540')?'254'+d.slice(4):d;
  if(d.startsWith('2540'))d='254'+d.slice(4);
  if(d.length===10&&d[0]==='0'&&'17'.includes(d[1]))return '254'+d.slice(1);
  if(d.length===9&&'17'.includes(d[0]))return '254'+d;
  if(d.length===12&&d.startsWith('254')&&'17'.includes(d[3]))return d;return ''}
async function hex32(s){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));return Array.from(h,b=>b.toString(16).padStart(2,'0')).join('').slice(0,32)}
const signedIn=()=>!!(ph||pin);
function signOut(msg){ph='';pin='';D=null;store.set('ph_'+code,'');store.set('pin','');store.set('data_'+code,null);loginMsg=msg||''}
let tab='songs',q='',folder='',cur=null,curPl=null,fromPl=null,big=store.get('big',false),busy=false;
let pls=store.get('pls_'+code,[]);
const savePls=()=>store.set('pls_'+code,pls);
const nS=n=>n+(n===1?' song':' songs');

function toast(t,err){const d=document.createElement('div');d.className='toast'+(err?' err':'');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),err?4500:2600)}
async function call(body){
  if(DEMO)return demoCall(body);
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j=await r.json();if(j.error)throw new Error(j.error);return j;
}
function demoCall(b){
  if(b.action==='join')return b.pin===DEMO.pin?{ok:1,legacy:1,church:DEMO.church,songs:DEMO.songs,folders:DEMO.folders,updated:new Date().toISOString()}:Promise.reject(new Error('no-match'));
  if(b.action==='team')return b.pin===DEMO.pin?{ok:1,church:DEMO.church,songs:DEMO.songs,folders:DEMO.folders,updated:new Date().toISOString()}:Promise.reject(new Error('Wrong PIN. (Demo PIN is '+DEMO.pin+')'));
  if(b.action==='send')return {ok:1};
  if(b.action==='sentStatus')return {ok:1,waiting:false,seen:new Date().toISOString()};
}
async function load(first){
  if(!code||!signedIn()){render();return}
  busy=true;if(first)render();
  try{
    const j=await call(ph?{action:'team',c:code,ph,did}:{action:'team',c:code,pin});
    D={church:j.church,songs:j.songs||[],folders:j.folders||[],updated:j.updated};store.set('data_'+code,D);reconcile();store.set('code',code);store.set('pin',pin);
  }catch(e){
    if(e.message==='signed-out'){signOut('You were signed out by your church\u2019s media team. Type your number and make a PIN to sign in again.')}
    else if(/pin|not found|suspend|no team/i.test(e.message)){if(/pin/i.test(e.message)){pin='';store.set('pin','');D=null}toast(e.message,1)}
    else if(!D)toast('No internet. Connect and try again.',1);
    else toast('Offline – showing the songs saved on this phone.',1);
  }
  busy=false;if(D&&PENDING_PL)importPl();render();
}
// the church's songs + songs this member added (sent with their playlist) + practice links they added
let mine=store.get('mine_'+code,[]),myLinks=store.get('links_'+code,{});
const saveMine=()=>{store.set('mine_'+code,mine);store.set('links_'+code,myLinks)};
const songs=()=>[...((D&&D.songs)||[]).map(s=>!s.l&&myLinks[s.i]?{...s,l:myLinks[s.i],ml:1}:s),...mine];
// once the church toolkit has added a member's new song, use the church's copy
function reconcile(){
  const by={};(D.songs||[]).forEach(s=>by[s.t.trim().toLowerCase()]=s);
  mine=mine.filter(m=>{const r=by[m.t.trim().toLowerCase()];if(!r)return true;
    pls.forEach(p=>p.items.forEach(x=>{if(x.s===m.i)x.s=r.i}));return false});
  (D.songs||[]).forEach(s=>{if(s.l)delete myLinks[s.i]});
  saveMine();savePls();
}
const songById=id=>songs().find(s=>s.i===id);
// a song can have several practice links: s.ls=[[link,name],…] (s.l is always the first)
const linksOf=s=>s&&Array.isArray(s.ls)&&s.ls.length?s.ls.map(x=>({u:x[0],n:x[1]||''})):(s&&s.l?[{u:s.l,n:''}]:[]);
const stanzas=t=>String(t||'').split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);

function render(){
  const a=$('app');
  if(!code||!signedIn()||!D){a.innerHTML=loginHtml();return}
  let h='<header><div class="hd"><img src="logo.jpg" alt="" onerror="this.style.display=\'none\'"><div class="t"><b>PREPFIX TEAM</b><span>'+esc(D.church)+'</span></div>'+(fsOK()?'<button onclick="goFull()" title="Full screen">⛶</button>':'')+(isStandalone()||DEMO?'':'<button id="instBtn" onclick="maybeInstall(1)" title="Install the app" style="display:inline-block">📲 Install</button>')+'<button onclick="load()" title="Get the newest songs"'+(busy?' disabled':'')+'>'+(busy?'…':'↻')+'</button>'+(ph?'<button onclick="outDlg()" title="Sign out">⎋</button>':'')+'</div>'+
    '<div class="tabs"><button class="'+(tab==='songs'?'on':'')+'" onclick="go(\'songs\')">🎵 Songs ('+songs().length+')</button><button class="'+(tab==='prac'?'on':'')+'" onclick="go(\'prac\')">🎧 Practice ('+songs().filter(s=>linksOf(s).length).length+')</button><button class="'+(tab==='pls'?'on':'')+'" onclick="go(\'pls\')">📋 Playlists ('+pls.length+')</button></div></header><main>';
  if(cur)h+=songHtml();else if(curPl)h+=plHtml();else if(tab==='songs')h+=listHtml();else if(tab==='prac')h+=pracHtml();else h+=plsHtml();
  h+='<div class="foot"><span style="font-weight:500;letter-spacing:0;color:#8a90a0">irericyrus004@gmail.com</span></div></main>';
  a.innerHTML=h;
  sizeBars();
  const qi=$('q');if(qi&&document.activeElement!==qi&&q)qi.setSelectionRange(q.length,q.length);
}
function loginHtml(){
  return '<div class="login"><img src="logo.jpg" alt="Prepfix" onerror="this.style.display=\'none\'"><h2>Prepfix Team</h2>'+(churchName()?'<p class="gold" style="font-weight:700;letter-spacing:.06em;margin:0 0 6px">'+esc(churchName())+'</p>':'')+'<p class="hint">Songs and practice links from your church’s Prepfix toolkit.</p>'+
    (code?'':'<input id="lc" placeholder="Church code" autocomplete="off">')+
    '<p class="hint">For members of the praise and worship team only. Type <b>the phone number the church registered</b> and <b>make your own 4-number PIN</b>. You stay signed in on this phone.</p>'+
    '<input id="lph" type="tel" inputmode="tel" placeholder="Phone number, e.g. 0712 345 678" autocomplete="tel" style="letter-spacing:.04em">'+
    '<input id="lp" type="password" inputmode="numeric" maxlength="4" placeholder="Make a PIN (4 numbers)" autocomplete="new-password">'+
    '<input id="lp2" type="password" inputmode="numeric" maxlength="4" placeholder="Type the PIN again" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')login()">'+
    '<button class="pri" style="width:100%;margin-top:8px" onclick="login()"'+(busy?' disabled':'')+'>'+(busy?'Opening…':'Open songs')+'</button>'+
    (loginMsg?'<p style="color:#ff8a7e;font-weight:600">'+esc(loginMsg)+'</p>':'')+
    (isStandalone()||DEMO?'':'<button style="width:100%;margin-top:10px" onclick="maybeInstall(1)">📲 Install the app on this phone</button>')+
    '<p class="hint" style="margin-top:16px">One phone per number. Changing phones? Sign out on the old phone first (⎋ at the top).</p>'+
    (DEMO?'<p class="gold">Demo: the PIN is '+esc(DEMO.pin)+'</p>':'')+'</div>';
}
async function login(){
  const c=$('lc');if(c){code=c.value.toLowerCase().split('-').pop().replace(/[^0-9a-f]/g,'');if(!code){toast('Type the church code.',1);return}}
  const n=normPhone($('lph').value),p=$('lp').value.replace(/\D/g,''),p2=(($('lp2')||{}).value||'').replace(/\D/g,'');
  if(!n){toast('Type your phone number, e.g. 0712 345 678.',1);return}
  if(p.length!==4){toast('Make a PIN of 4 numbers.',1);return}
  if(p!==p2){toast('The two PINs are not the same.',1);return}
  pls=store.get('pls_'+code,[]);mine=store.get('mine_'+code,[]);myLinks=store.get('links_'+code,{});
  busy=true;loginMsg='';render();
  const h=await hex32(code+'|'+n);
  try{
    const j=await call({action:'join',c:code,ph:h,pin:p,did,plat});
    if(j.legacy){pin=p;store.set('pin',pin)}else{ph=h;store.set('ph_'+code,ph)}       // legacy = the church still uses one team PIN
    store.set('code',code);
    D={church:j.church,songs:j.songs||[],folders:j.folders||[],updated:j.updated};store.set('data_'+code,D);reconcile();
    if(j.name){store.set('me',j.name);toast('Welcome, '+j.name)}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }catch(e){
    loginMsg=e.message==='no-match'?'This number is not on your church\u2019s team list. Check it, or ask the media team.'

function ytId(u){const h=u.hostname.replace(/^(www|m|music)\./,'');let id='';
  if(h==='youtu.be')id=u.pathname.slice(1).split('/')[0];
  else if(/(^|\.)youtube(-nocookie)?\.com$/.test(h)){id=u.searchParams.get('v')||'';const m=u.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{6,})/);if(m)id=m[2]}
  return /^[\w-]{6,20}$/.test(id)?id:''}
function ytStart(u){const t=u.searchParams.get('t')||u.searchParams.get('start')||'';if(/^\d+$/.test(t))return +t;const m=t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0}
function practiceSrc(link){let u;try{u=new URL(link)}catch(e){return null}
  const h=u.hostname.replace(/^www\./,''),id=ytId(u),list=u.searchParams.get('list');
  if(id)return {kind:'frame',src:'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0'+(ytStart(u)?'&start='+ytStart(u):''),name:'YouTube'};
  if(/youtube\.com$/.test(h)&&list)return {kind:'frame',src:'https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(list)+'&autoplay=1&playsinline=1',name:'YouTube'};
  if(h==='open.spotify.com'){const m=u.pathname.match(/\/(track|album|playlist|episode)\/(\w+)/);if(m)return {kind:'frame',src:'https://open.spotify.com/embed/'+m[1]+'/'+m[2],name:'Spotify'}}
  if(h==='audiomack.com'){const m=u.pathname.match(/^\/([^/]+)\/(song|album|playlist)\/([^/]+)/);if(m)return {kind:'frame',src:'https://audiomack.com/embed/'+m[2]+'/'+m[1]+'/'+m[3],name:'Audiomack'}}
  if(h==='soundcloud.com')return {kind:'frame',src:'https://w.soundcloud.com/player/?auto_play=true&url='+encodeURIComponent(link),name:'SoundCloud'};
  if(/\.(mp3|m4a|aac|ogg|oga|wav|opus)$/i.test(u.pathname))return {kind:'audio',src:link,name:'Music'};
  if(/\.(mp4|webm|ogv|mov)$/i.test(u.pathname))return {kind:'video',src:link,name:'Video'};
  return {kind:'frame',src:link,name:h,other:true}}

const b64e=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let t='';b.forEach(c=>t+=String.fromCharCode(c));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64d=r=>{let t=r.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const a=atob(t),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))};
function churchParam(){
  const nm=store.get('cname_'+code,'')||(D&&D.church)||'';
  const slug=String(nm).toLowerCase().replace(/['’.]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return slug?slug+'-'+code:code;
}
// short link: songs travel as their first 5 characters (checked to be unique in the church list); names are written as plain text.
// If any chosen song cannot be told apart that way, the older (longer) link is made instead. Both kinds open fine.
const PRE=5,escQ=t=>encodeURIComponent(t).replace(/[.~!*'()]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase());
function plLink(p){
  const list=(D&&D.songs)||[],have=new Set(list.map(x=>x.i));let skipped=0;
  const i=[];p.items.forEach(x=>{if(x.sec)i.push([x.sec,x.lead||'']);else if(have.has(x.s))i.push(x.s);else skipped++});
  const count=i.filter(x=>typeof x==='string').length,base=location.origin+location.pathname+'?church='+churchParam();
  const cnt={};list.forEach(x=>{const k=String(x.i).slice(0,PRE);cnt[k]=(cnt[k]||0)+1});
  const ok=i.every(x=>Array.isArray(x)||(String(x).length>=PRE&&cnt[String(x).slice(0,PRE)]===1));
  if(ok){
    const toks=[];let run='';
    i.forEach(x=>{if(Array.isArray(x)){if(run){toks.push(run);run=''}toks.push('.'+escQ(x[0])+'.'+escQ(x[1]))}else run+=String(x).slice(0,PRE)});
    if(run)toks.push(run);
    return {skipped,count,link:base+'&q='+[p.id,escQ(p.name),escQ(p.by||'')].concat(toks).join('~')};
  }
  return {skipped,count,link:base+'&pl='+b64e({p:p.id,n:p.name,b:p.by||'',i})};
}
function teamMsg(p){
  const l=plLink(p);
  // next Sunday (today if it is Sunday), written day/month/year
  const d=new Date();d.setDate(d.getDate()+(7-d.getDay())%7);
  const when='Sunday: '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
  const all=songs(),nm=id=>{const o=all.find(y=>y.i===id);return o?o.t:''};
  const out=['*Ministration Songs*',when];let n=0;
  p.items.forEach(x=>{
    if(x.sec){const t=String(x.sec).replace(/\s*set\s*$/i,'').trim()||x.sec;out.push('Set: '+t);n=0}
    else{const t=nm(x.s);if(t){n++;out.push(n+'. '+t)}}
  });
  out.push('','Open this playlist, listen as you learn.',l.link);
  return out.join('\n');
}

/* ---------- search many songs at once, then make a playlist and share it ---------- */
// One song on each line (or separated by commas): a number (120), a title, words from the lyrics, or a range (105-110).
// Each line shows ALL the songs that match, in the order written: every song with that number, every song with those words.
let mTxt='',mSel={},mIds=[];
const mNorm=t=>' '+String(t||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim()+' ';
const mBare=t=>String(t||'').replace(/^\s*\d+\s*[.)]\s+/,'');
const mNo=s=>{const n=parseInt(s.no,10);if(n>0)return n;const m=String(s.t||'').match(/^\s*(\d+)\s*[.)]\s/);return m?+m[1]:0};
const mByT=(a,b)=>{const x=mNo(a),y=mNo(b);if(x&&y)return x-y||mBare(a.t).localeCompare(mBare(b.t),undefined,{sensitivity:'base'});if(x)return -1;if(y)return 1;return mBare(a.t).localeCompare(mBare(b.t),undefined,{sensitivity:'base'})};
const mIsNo=t=>/^(?:#|no\.?\s*|number\s*)?\d+$/i.test(t);
function mTerms(txt){
  const lines=String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean),multi=lines.length>1,out=[];
  lines.forEach(l=>{
    let parts=(!multi||/^[\d\s,;+–-]+$/.test(l))?l.split(/[,;+]+/).map(t=>t.trim()).filter(Boolean):[l];
    parts=parts.flatMap(x=>/^\d+(\s+\d+)+$/.test(x)?x.split(/\s+/):[x]);
    parts.forEach(t=>{const m=t.match(/^(?:#|no\.?\s*)?(\d+)\s*(?:-|–|to)\s*(\d+)$/i);
      if(m&&+m[2]>=+m[1]&&+m[2]-+m[1]<300){for(let n=+m[1];n<=+m[2];n++)out.push(String(n))}else out.push(t)});
  });
  return out;
}
// main = the songs to show first (ticked), more = songs that only have the words inside their lyrics (not ticked)
function mCands(t){
  const all=songs(),m=t.match(/^(?:#|no\.?\s*|number\s*)?(\d+)$/i);
  if(m){const d=+m[1];return {main:all.filter(s=>mNo(s)===d).sort(mByT),more:[],tick:true}}
  const kn=mNorm(t).trim();if(!kn)return {main:[],more:[],tick:true};
  const words=kn.split(' '),T=[],X=[],W=[];
  all.forEach(s=>{
    const a=mNorm(mBare(s.t)),b=mNorm(s.x);
    if(a.includes(kn))T.push({s,r:a.trim()===kn?0:1});
    else if(b.includes(kn))X.push(s);
    else if(words.length>1&&words.every(w=>(a+b).includes(w)))W.push(s);
  });
  T.sort((x,y)=>x.r-y.r||mByT(x.s,y.s));
  const ti=T.map(o=>o.s),lyr=[...X.sort(mByT),...W.sort(mByT)];
  if(ti.length)return {main:ti.slice(0,30),more:lyr.slice(0,12),tick:true};
  return {main:lyr.slice(0,30),more:[],tick:lyr.length<=3};   // words found only in lyrics: tick them by hand if there are many
}
function mRun(){
  const ta=$('manyT');if(ta)mTxt=ta.value;
  const terms=mTerms(mTxt),seen=new Set();let bad=0;mIds=[];
  const rowH=(s,def)=>{
    if(seen.has(s.i))return '<div class="mr dup"><span class="mk">=</span><div><b>'+esc(s.t)+'</b><small>already listed above</small></div></div>';
    seen.add(s.i);const on=mSel[s.i]!==undefined?mSel[s.i]:def;if(on)mIds.push(s.i);
    return '<label class="mr"><input type="checkbox"'+(on?' checked':'')+' onchange="mTog(\''+esc(s.i)+'\',this.checked)"><div><b>'+esc(s.t)+'</b>'+(s.f?'<small>📁 '+esc(s.f)+'</small>':'')+'</div></label>'};
  const html=terms.map(t=>{
    const c=mCands(t);
    if(!c.main.length&&!c.more.length){bad++;return '<div class="mt bad">✗ “'+esc(t)+'” – '+(mIsNo(t)?'no song has this number.':'no song has these words.')+'</div>'}
    let h='<div class="mt">“'+esc(t)+'” <span class="hint">· '+nS(c.main.length)+'</span></div>'+c.main.map(s=>rowH(s,c.tick)).join('');
    if(c.more.length)h+='<div class="mt sub">Also has these words in the lyrics</div>'+c.more.map(s=>rowH(s,false)).join('');
    return h;
  }).join('');
  $('manyRes').innerHTML=html||'<p class="hint" style="padding:8px 10px;margin:0">Example:<br>Mungu Anena Hili<br>Na Hayana Mpaka<br>120<br>130</p>';
  $('manyInfo').innerHTML=terms.length?'<b style="color:#2e9d6b">'+nS(mIds.length)+' ticked</b>'+(bad?' · <b style="color:#ff8a7e">'+bad+' not found</b>':''):'';
  $('manyGo').disabled=!mIds.length;
}

/* ---------- tidy pasted words, the same way as the church toolkit ---------- */
const capWords=s=>String(s).toLocaleLowerCase().replace(/(^|[\s"“‘(\[¡¿\/])('?)(\p{L})/gu,(m,a,q,b)=>a+q+b.toLocaleUpperCase());
const LABEL=/^\s*[\[(<{]?\s*(verse|chorus|refrain|bridge|pre-?chorus|tag|ending|intro|outro|coda|interlude|instrumental|vamp|ubeti|kiitikio|korasi|kibwagizo|mstari)\s*\.?\s*\d*\s*[a-z]?\s*[\])>}]?\s*[:.\-]?\s*(x\s*\d+)?\s*$|^\s*[\[(]\s*[vcbpte]\s*\d*\s*[\])]\s*$|^\s*[vcbp]\d+\s*:?\s*$/i;
const FOOT=/^\s*(ccli\b|©|\(c\)\s|copyright\b|for use solely|note: reproduction|all rights reserved|used by permission|licen[cs]e\s*(no|#|number)|songselect\b)/i;
// Finds the stanzas in pasted or imported words:
// - section names (Verse 2, Chorus, Kiitikio…) and hymn numbers ("2. ") start a new stanza
// - words copied with an empty line after EVERY line (web pages, WhatsApp) are joined back:
//   one empty line = next line, two or more empty lines = next stanza
function markBreaks(t){
  t=String(t||'').replace(/\r\n?/g,'\n').replace(/[  -​ 　﻿]/g,' ');
  let L=t.split('\n').map(x=>x.trim());
  const blocks=t.split(/\n[ \t]*\n/).map(b=>b.trim()).filter(Boolean);
  const single=blocks.filter(b=>!b.includes('\n')).length;
  if(blocks.length>=5&&single/blocks.length>=0.7){ // double-spaced: rebuild with real stanza breaks
    const out=[];let empty=0;
    for(const l of L){if(!l){empty++;continue}if(out.length&&empty>=2)out.push('');empty=0;out.push(l)}
    L=out;
  }
  const out=[];
  for(const l of L){
    if(LABEL.test(l)){if(out.length&&out[out.length-1]!=='')out.push('');continue}
    if(/^\d{1,2}[.)]\s*\p{L}/u.test(l)){if(out.length&&out[out.length-1]!=='')out.push('');out.push(l.replace(/^\d{1,2}[.)]\s*/,''));continue}
    out.push(l);
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function tidyText(t){
  t=markBreaks(t);
  const out=[];
  String(t).split(/\n\s*\n/).map(b=>b.split('\n').map(l=>l.trim()).filter(l=>l&&!/author\s*unknown/i.test(l)&&!FOOT.test(l)).map(capWords)).filter(st=>st.length).forEach(st=>{
    if(st.length>8){const n=Math.floor(st.length/4);for(let i=0;i<n;i++)out.push(st.slice(i*4,i===n-1?st.length:i*4+4))}
    else out.push(st);
  });
  return out.map(a=>a.join('\n')).join('\n\n');
}
const tidyTitle=t=>capWords(String(t).replace(/[\s_(\[-]*(by[\s_]+)?author[\s_]*unknown[\s_)\]]*/gi,' ').replace(/_+/g,' ').replace(/\s+/g,' ').trim());
function fixLink(v){v=String(v||'').trim();if(!v)return '';if(!/^https?:\/\//i.test(v))v='https://'+v;try{const u=new URL(v);return /\./.test(u.hostname)?u.href:false}catch(e){return false}}
function newSong(id,plId){
  const m=id?mine.find(x=>x.i===id):null;
  dlgForm(m?'Edit your song':'New song',[['t','Title',m?m.t:''],['x','Lyrics – paste them; they are tidied for you (capital letters, empty line between stanzas)',m?m.x:'','area'],['l','Practice link – YouTube etc. (optional)',m?m.l||'':'']],v=>{
    v.t=tidyTitle(v.t);v.x=tidyText(v.x);

    const l=fixLink(v.l);if(l===false){toast('The link does not look right.',1);return}
    if(m){Object.assign(m,{t:v.t,x:v.x,l});saveMine();render();return}
